name: test

on:
  pull_request:
  push:
    branches: [master, test, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.10'
  RUST_VERSION: '1.93.1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: libwg/wireguard-go/go.sum
      - name: setup rust (Unix)
        if: runner.os != 'Windows'
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: setup rust (Windows GNU)
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install "$env:RUST_VERSION-x86_64-pc-windows-gnu" --profile minimal
          rustup default "$env:RUST_VERSION-x86_64-pc-windows-gnu"
      - name: build libwg (Unix)
        if: runner.os != 'Windows'
        run: cd libwg && ./build.sh
      - name: build libwg (Windows)
        if: runner.os == 'Windows'
        run: cd libwg; ./build.ps1
      - name: test Go
        working-directory: libwg/wireguard-go
        run: go test ./... -timeout=120s
      - name: test transport races (Unix)
        if: runner.os != 'Windows'
        working-directory: libwg/wireguard-go
        run: go test -race ./conn ./libwg ./device -timeout=120s
      - name: test Rust (loopback and temporary fixtures only)
        run: cargo test --locked
      - name: build release
        run: cargo build --locked --release
